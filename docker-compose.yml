services:
  postgres:
    image: postgres:16
    container_name: xora_postgres
    hostname: postgres
    environment:
      POSTGRES_USER: xora
      POSTGRES_PASSWORD: xora
      POSTGRES_DB: xora
    ports:
      - "5432:5432"
    volumes:
      - xora_pg_data:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xora -d xora"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: xora_api
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "xora_postgres:host-gateway"
      - "postgres:host-gateway"
    environment:
      DATABASE_URL: postgresql+psycopg://xora:xora@xora_postgres:5432/xora
      XORA_TIMEFRAME: 15m
      XORA_HORIZON: 15m
      XORA_CYCLE_SECONDS: "10"
      XORA_PAPER_MARGIN: "10"
      XORA_PAPER_LEVERAGE: "15"
      XORA_MIN_TRADES: "3"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: xora_worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "xora_postgres:host-gateway"
      - "postgres:host-gateway"
    environment:
      DATABASE_URL: postgresql+psycopg://xora:xora@xora_postgres:5432/xora
      XORA_TIMEFRAME: 15m
      XORA_HORIZON: 15m
      XORA_CYCLE_SECONDS: "10"
      XORA_PAPER_MARGIN: "10"
      XORA_PAPER_LEVERAGE: "15"
      XORA_MIN_TRADES: "3"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  xora_pg_data:
