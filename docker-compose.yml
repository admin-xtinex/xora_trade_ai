services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: xora
      POSTGRES_PASSWORD: xora
      POSTGRES_DB: xora
    ports:
      - "5432:5432"
    volumes:
      - xora_pg_data:/var/lib/postgresql/data
      - ./schema/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xora -d xora"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [xora]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://xora:xora@postgres:5432/xora
      XORA_UNIVERSE: BTCUSDT,ETHUSDT,SOLUSDT
      XORA_TIMEFRAME: 15m
      XORA_HORIZON: 15m
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [xora]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg://xora:xora@postgres:5432/xora
      XORA_UNIVERSE: BTCUSDT,ETHUSDT,SOLUSDT
      XORA_TIMEFRAME: 15m
      XORA_HORIZON: 15m
      XORA_CYCLE_SECONDS: "300"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    networks: [xora]

  pgadmin:
    image: dpage/pgadmin4
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@xora.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [xora]

networks:
  xora:

volumes:
  xora_pg_data:
