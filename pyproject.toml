[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xora"
version = "0.1.0"
description = "XORA Prediction AI — independent prediction platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
