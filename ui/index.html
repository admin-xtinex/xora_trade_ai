<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XORA Desk</title>
  <style>
    :root { --bg:#070b16; --panel:#10182f; --line:#26345c; --text:#eaf0ff; --muted:#8ea0c7; --up:#3ee0a2; --down:#ff6b7a; --accent:#7db2ff; }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(900px 500px at 0 -10%,#18244a,var(--bg));color:var(--text)}
    header{display:flex;justify-content:space-between;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
    h1{margin:0;font-size:18px}
    .sub{color:var(--muted);font-size:12px;margin-top:4px}
    button{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;background:var(--accent);color:#071018}
    button.secondary{background:#1c2748;color:var(--text)}
    .chip{background:#1c2748;color:var(--muted);border:0;border-radius:8px;padding:8px 10px;font-weight:700;cursor:pointer}
    .chip.on{background:var(--accent);color:#071018}
    .ok{color:var(--up)} .bad{color:var(--down)}
    .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:16px 22px 0}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
    .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
    .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);margin-right:6px;box-shadow:0 0 8px var(--up)}
    main{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;padding:16px 22px 40px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
    tr{cursor:pointer} tr:hover{background:#182247}
    tr.active-row{background:#13263f}
    .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
    .UP{background:#123d32;color:var(--up)} .DOWN{background:#3d1820;color:var(--down)}
    .OPEN{background:#1d3a2c;color:var(--up)} .CLOSED{background:#2a334c;color:var(--muted)}
    pre{white-space:pre-wrap;font-size:12px;color:#d5def6}
    @media(max-width:980px){main,.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <div>
    <h1>XORA 15m IST desk</h1>
    <div class="sub">Active paper trades stay pinned at the top until TP, SL, or slot end.</div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <span id="ws">connecting…</span>
    <button id="start">Start trading</button>
    <button class="secondary" id="refresh">Refresh</button>
  </div>
</header>
<section class="card" style="margin:16px 22px 0">
  <div class="k">Engines</div>
  <div id="engineBar" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>
</section>
<section class="grid">
  <div class="card"><div class="k">Now IST</div><div id="now">—</div></div>
  <div class="card"><div class="k">Slot</div><div id="slot">—</div></div>
  <div class="card"><div class="k">Phase</div><div id="phase">idle</div></div>
  <div class="card"><div class="k">Active / closed</div><div id="counts">0 / 0</div></div>
  <div class="card"><div class="k">Net PnL</div><div id="pnl">0</div></div>
</section>
<section class="card" style="margin:16px 22px 0">
  <div class="k"><span class="live-dot"></span>Active trades</div>
  <div id="activeWrap" class="sub" style="margin-top:8px">No open trades yet.</div>
</section>
<main>
  <div class="card">
    <div class="k">Closed / history</div>
    <div id="tableWrap" style="margin-top:8px"></div>
  </div>
  <div class="card" id="detail"><div class="sub">Click an active or closed trade for why entered / why exited / PnL proof.</div></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let engines = [], active = [];
  const pctp = (v) => v == null ? "—" : Number(v).toFixed(6);
  const pill = (d) => `<span class="pill ${d || "UP"}">${d || "—"}</span>`;
  const label = (key) => (engines.find(e => e.key === key) || {}).name || key || "—";
  function rowsHtml(rows, live) {
    if (!rows.length) return "";
    return `<table><thead><tr>
      <th>Status</th><th>Engine</th><th>Coin</th><th>Side</th><th>Entry</th><th>TP</th><th>SL</th><th>Exit / mark</th><th>PnL</th>
    </tr></thead><tbody>` + rows.map(r => `<tr class="${live ? "active-row" : ""}" data-id="${r.id}">
      <td>${pill(r.status === "open" ? "OPEN" : "CLOSED")}</td>
      <td>${label(r.engine_name)}</td><td>${r.symbol || r.coin_symbol || ""}</td><td>${pill(r.side)}</td>
      <td>${pctp(r.entry_price)}</td><td>${pctp(r.tp_price)}</td><td>${pctp(r.sl_price)}</td>
      <td>${pctp(r.exit_price)}</td>
      <td>${r.status === "open" ? "watching" : (r.pnl_usdt == null ? "—" : Number(r.pnl_usdt).toFixed(4))}</td>
    </tr>`).join("") + "</tbody></table>";
  }
  async function get(path) {
    const res = await fetch(path);
    if (!res.ok) throw new Error(path + " " + res.status);
    return res.json();
  }
  function renderEngines() {
    $("engineBar").innerHTML = engines.map(e =>
      `<button class="chip ${active.includes(e.key) ? "on" : ""}" data-key="${e.key}">${e.name}</button>`
    ).join("");
  }
  async function load() {
    const snap = await get("/api/v1/session").catch(() => ({}));
    engines = snap.engines || engines;
    active = snap.active_engines || active;
    renderEngines();
    const clock = snap.clock || {};
    $("now").textContent = clock.now ? new Date(clock.now).toLocaleString() : "—";
    $("slot").textContent = (snap.session && snap.session.notes) || clock.next_slot || "—";
    $("phase").textContent = snap.session ? snap.session.status : "idle";
    $("counts").textContent = (snap.open_trades ?? 0) + " / " + (snap.closed_trades ?? 0);
    $("pnl").textContent = (snap.net_pnl ?? 0).toFixed(4) + " USDT";
    const [openRows, closedRows] = await Promise.all([
      get("/api/v1/trades?status=open").catch(() => []),
      get("/api/v1/trades?status=closed").catch(() => []),
    ]);
    const opens = Array.isArray(openRows) ? openRows : [];
    const closed = Array.isArray(closedRows) ? closedRows : [];
    $("activeWrap").innerHTML = opens.length ? rowsHtml(opens, true) : "<div class='sub'>No active trades in this slot. Worker opens them when phase=live.</div>";
    $("tableWrap").innerHTML = closed.length ? rowsHtml(closed, false) : "<div class='sub'>No closed trades yet.</div>";
  }
  async function show(id) {
    const t = await get("/api/v1/trades/" + id);
    const p = t.pnl_proof || {};
    $("detail").innerHTML = `
      <h3 style="margin:0 0 8px">${label(t.engine_name)} · ${t.symbol} ${pill(t.side)} ${pill(t.status === "open" ? "OPEN" : "CLOSED")}</h3>
      <p><b>Entry</b> ${pctp(t.entry_price)} · <b>Exit</b> ${pctp(t.exit_price)}<br>
      <b>TP</b> ${pctp(t.tp_price)} · <b>SL</b> ${pctp(t.sl_price)}</p>
      <p><b>Why entered:</b> ${t.why_entered || "—"}<br>
      <b>Why exited:</b> ${t.why_exited || "still open — watching live Binance price"}<br>
      <b>What went wrong:</b> ${t.what_went_wrong || "none"}</p>
      <div class="k">PnL proof</div>
      <pre>${p.worked_example || "Open trade — proof appears after exit."}
qty = (margin ${p.margin_usdt ?? 10} × lev ${p.leverage ?? 15}) / entry
proof_ok = ${p.proof_ok ?? "pending"}</pre>`;
  }
  $("engineBar").addEventListener("click", async ev => {
    const btn = ev.target.closest("[data-key]");
    if (!btn) return;
    const key = btn.dataset.key;
    const next = active.includes(key) ? active.filter(k => k !== key) : active.concat(key);
    if (!next.length) return alert("Keep at least one engine");
    const data = await fetch("/api/v1/engines/active", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({keys: next})}).then(r => r.json());
    active = data.active; renderEngines();
  });
  document.body.addEventListener("click", ev => {
    const tr = ev.target.closest("tr[data-id]");
    if (tr) show(tr.dataset.id);
  });
  $("refresh").onclick = load;
  $("start").onclick = async () => {
    $("start").disabled = true;
    try {
      const res = await fetch("/api/v1/admin/start", {method:"POST"}).then(r => r.json());
      alert("Armed " + (res.slot || "next IST slot"));
      await load();
    } finally { $("start").disabled = false; }
  };
  function connectWs() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(proto + "://" + location.host + "/ws");
    ws.onopen = () => $("ws").innerHTML = '<span class="ok">live</span>';
    ws.onmessage = load;
    ws.onclose = () => { $("ws").innerHTML = '<span class="bad">retry</span>'; setTimeout(connectWs, 4000); };
  }
  load();
  connectWs();
  setInterval(load, 5000);
</script>
</body>
</html>
