<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XORA Desk</title>
  <style>
    :root { --bg:#070b16; --panel:#10182f; --line:#26345c; --text:#eaf0ff; --muted:#8ea0c7; --up:#3ee0a2; --down:#ff6b7a; --mid:#f0c14b; --accent:#7db2ff; }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(900px 500px at 0 -10%,#18244a,var(--bg));color:var(--text)}
    header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
    h1{margin:0;font-size:18px}
    .sub{color:var(--muted);font-size:12px;margin-top:4px}
    button{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;background:var(--accent);color:#071018}
    button.secondary{background:#1c2748;color:var(--text)}
    .chip{background:#1c2748;color:var(--muted);border:0;border-radius:8px;padding:8px 10px;font-weight:700;cursor:pointer}
    .chip.on{background:var(--accent);color:#071018}
    .engine{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:120px;text-align:left}
    .engine small{font-weight:500;opacity:.8}
    .ok{color:var(--up)} .bad{color:var(--down)}
    .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:16px 22px 0}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
    .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
    main{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;padding:16px 22px 40px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
    tr{cursor:pointer}
    tr:hover{background:#182247}
    .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
    .UP{background:#123d32;color:var(--up)} .DOWN{background:#3d1820;color:var(--down)} .NEUTRAL{background:#3a3016;color:var(--mid)}
    .why{line-height:1.5}
    @media(max-width:980px){main,.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <div>
    <h1>XORA 15m desk</h1>
    <div class="sub">Select one or more engines. Each engine owns its own entry, exit, TP and SL. All three can run at once.</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span id="ws">connecting…</span>
    <button class="secondary" id="refresh">Refresh</button>
    <button id="cycle">Run cycle</button>
  </div>
</header>
<section class="card" style="margin:16px 22px 0">
  <div class="k">Engines</div>
  <div id="engineBar" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>
</section>
<section class="grid">
  <div class="card"><div class="k">Phase</div><div id="phase">—</div></div>
  <div class="card"><div class="k">Open</div><div id="nOpen">0</div></div>
  <div class="card"><div class="k">Closed</div><div id="nClosed">0</div></div>
  <div class="card"><div class="k">Net PnL</div><div id="pnl">0</div></div>
  <div class="card"><div class="k">Active engines</div><div id="activeN">0</div></div>
</section>
<main>
  <div class="card" id="tableWrap"></div>
  <div class="card" id="detail"><div class="sub">Click a trade for TP, SL, entry, exit and why.</div></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let engines = [];
  let active = [];
  const pctp = (v) => v == null ? "—" : Number(v).toFixed(6);
  const pill = (d) => `<span class="pill ${d || "NEUTRAL"}">${d || "—"}</span>`;
  const label = (key) => (engines.find(e => e.key === key) || {}).name || key || "—";
  async function get(path) {
    const res = await fetch(path);
    if (!res.ok) throw new Error(path + " " + res.status);
    return res.json();
  }
  function renderEngines() {
    $("engineBar").innerHTML = engines.map(e => `
      <button class="chip engine ${active.includes(e.key) ? "on" : ""}" data-key="${e.key}">
        ${e.name}
        <small>TP ${(e.tp_pct*100).toFixed(1)}% · SL ${(e.sl_pct*100).toFixed(1)}%</small>
      </button>`).join("");
    $("activeN").textContent = active.map(label).join(", ") || "none";
  }
  async function toggleEngine(key) {
    const next = active.includes(key) ? active.filter(k => k !== key) : active.concat(key);
    if (!next.length) return alert("Select at least one engine");
    const res = await fetch("/api/v1/engines/active", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({keys: next})
    });
    const data = await res.json();
    active = data.active || next;
    renderEngines();
  }
  async function load() {
    const snap = await get("/api/v1/session").catch(() => ({}));
    engines = snap.engines || engines;
    active = snap.active_engines || active;
    renderEngines();
    $("nOpen").textContent = snap.open_trades ?? 0;
    $("nClosed").textContent = snap.closed_trades ?? 0;
    $("pnl").textContent = (snap.net_pnl ?? 0).toFixed(2) + " USDT";
    $("phase").textContent = snap.session ? snap.session.status : "idle";
    const rows = await get("/api/v1/trades").catch(() => []);
    if (!rows.length) {
      $("tableWrap").innerHTML = "<div class='sub'>No trades yet. Select engines, then run a cycle after warmup.</div>";
      return;
    }
    $("tableWrap").innerHTML = `<table><thead><tr>
      <th>Engine</th><th>Coin</th><th>Side</th><th>Entry</th><th>TP</th><th>SL</th><th>Exit</th><th>PnL</th><th>Status</th>
    </tr></thead><tbody>` + rows.map(r => `<tr data-id="${r.id}">
      <td>${label(r.engine_name)}</td><td>${r.symbol}</td><td>${pill(r.side)}</td>
      <td>${pctp(r.entry_price)}</td><td>${pctp(r.tp_price)}</td><td>${pctp(r.sl_price)}</td>
      <td>${pctp(r.exit_price)}</td>
      <td>${r.pnl_usdt == null ? "—" : Number(r.pnl_usdt).toFixed(2)}</td>
      <td>${r.status}</td>
    </tr>`).join("") + "</tbody></table>";
  }
  async function show(id) {
    const t = await get("/api/v1/trades/" + id);
    $("detail").innerHTML = `
      <h3 style="margin:0 0 8px">${label(t.engine_name || (t.analysis_data||{}).engine)} · ${t.symbol} ${pill(t.side)}</h3>
      <div class="sub">This engine owned entry, TP, SL and exit.</div>
      <p class="why"><b>Entry:</b> ${pctp(t.entry_price)} · <b>Exit:</b> ${pctp(t.exit_price)}<br>
      <b>TP:</b> ${pctp(t.tp_price)} · <b>SL:</b> ${pctp(t.sl_price)}<br>
      <b>PnL:</b> ${t.pnl_usdt == null ? "open" : Number(t.pnl_usdt).toFixed(4) + " USDT"}</p>
      <p class="why"><b>Why entered:</b> ${t.why_entered || "—"}</p>
      <p class="why"><b>Why exited:</b> ${t.why_exited || "still open"}</p>
      <p class="why"><b>Outcome:</b> ${t.outcome || "—"}</p>
      <p class="why"><b>What went wrong:</b> ${t.what_went_wrong || "Nothing recorded as an error."}</p>`;
  }
  $("engineBar").addEventListener("click", ev => {
    const btn = ev.target.closest("[data-key]");
    if (btn) toggleEngine(btn.dataset.key);
  });
  $("tableWrap").addEventListener("click", ev => {
    const tr = ev.target.closest("tr[data-id]");
    if (tr) show(tr.dataset.id);
  });
  $("refresh").onclick = load;
  $("cycle").onclick = async () => {
    $("cycle").disabled = true;
    try { await fetch("/api/v1/admin/cycles", {method:"POST"}); await load(); }
    finally { $("cycle").disabled = false; }
  };
  function connectWs() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(proto + "://" + location.host + "/ws");
    ws.onopen = () => { $("ws").innerHTML = '<span class="ok">live websocket</span>'; };
    ws.onmessage = load;
    ws.onclose = () => { $("ws").innerHTML = '<span class="bad">socket retry</span>'; setTimeout(connectWs, 4000); };
  }
  load();
  connectWs();
</script>
</body>
</html>
